# Ansible items
ansible_user     : ""
ansible_password : ""

# Generic items
prefix          : "" # Prefix for the deployment e.g. prod.

# VM items
vm_os   : "ubuntu" # Choices : [ubuntu, rocky] — Ubuntu 22.04/24.04 or Rocky Linux 9
vm_arch : "amd64"  # Choices : [amd64]

# System items
enable_cgroup_v2    : true     # NOTE: cgroup v2 is required for Kubernetes 1.35+
system_ssh_keys_dir : "~/.ssh" # Directory holding public keys to be used on each system

# Deployment Options
deployment_type : "bare_metal"

# Kubernetes - Common
#
# Consult SAS Viya Documentation for supported kubernetes versions for the release that is being deployed.
#
kubernetes_cluster_name    : "{{ prefix }}-oss" # NOTE: only change the prefix value above
kubernetes_arch            : "{{ vm_arch }}"
kubernetes_version         : "" # Supported versions: "1.33.x" - "1.36.x"
kubernetes_cri_version     : "" # Choices : [Ubuntu 22.04/24.04: "2.2.2"] - requires containerd >= 2.0.0 for KubeletCgroupDriverFromCRI (K8s 1.34+)
kubernetes_cni             : "calico"       # Choices : [calico]
kubernetes_cni_version     : "3.32.1"       # Choices : [3.32.1]
kubernetes_cri             : "containerd"   # Choices : [containerd]
kubernetes_service_subnet  : "10.43.0.0/16" # Default cluster scoped CIDR
kubernetes_pod_subnet      : "10.42.0.0/16" # Default cluster scoped CIDR
kubernetes_cluster_dns     : ""             # DNS IP for kubelet (service_subnet first IP + .10)
kubernetes_upgrade_allowed : true

# Kubernetes - VIP : https://kube-vip.io
#
# This IP is the HA IP for the control nodes, it will dynamically allocate to the primary node.
# It should be an available IP addressable to all nodes in the cluster as well as any other
# client that will be making admin changes to the cluster.
# FQDN should be the desired hostname for the control plane (administrative APIs) and exist in DNS.
#
kubernetes_vip_version : "0.7.1"
kubernetes_vip_ip      : ""
kubernetes_vip_fqdn    : ""

# Kubernetes - Load Balancer
#
# NOTE: To support SingleStore usage in the viya4-iac-k8s code base
#       you need to set the value of the kubernetes_loadbalancer to
#       metallb. Setting this value to anything other than metallb will
#       create a cluster that will not work with Single Store.
#
kubernetes_loadbalancer : "" # Load Balancer accepted values [kube_vip,metallb]

# Load Balancer Addresses
#
# Examples for each load balancer type can be found here:
#
#  kube-vip address format : https://kube-vip.io/docs/usage/cloud-provider/#the-kube-vip-cloud-provider-configmap
#  MetalLB address format  : https://metallb.universe.tf/configuration/#layer-2-configuration
#
#    kube-vip sample:
#
#      kubernetes_loadbalancer_addresses :
#        - "cidr-default: 192.168.0.200/29"
#        - "range-development: 192.168.0.210-192.168.0.219"
#
#    MetalLB sample:
#
#      kubernetes_loadbalancer_addresses :
#        - "192.168.10.0/24"
#        - "192.168.9.1-192.168.9.5"
#
kubernetes_loadbalancer_addresses : []

# Kubernetes - Control Plane
control_plane_ssh_key_name : "cp_ssh"

# Labels/Taints
#
#   The label names match the host names to apply these items.
#   If the node names do not match you'll have to apply these
#   taints/labels by hand.
#
## Labels
node_labels:
  cas:
    - workload.sas.com/class=cas
  compute:
    - launcher.sas.com/prepullImage=sas-programming-environment
    - workload.sas.com/class=compute
  singlestore:
    - workload.sas.com/class=singlestore
  stateful:
    - workload.sas.com/class=stateful
  stateless:
    - workload.sas.com/class=stateless
  system:
    - kubernetes.azure.com/mode=system

## Taints
node_taints:
  cas:
    - workload.sas.com/class=cas:NoSchedule
  compute:
    - workload.sas.com/class=compute:NoSchedule
  singlestore:
    - workload.sas.com/class=singlestore:NoSchedule
  stateful:
    - workload.sas.com/class=stateful:NoSchedule
  stateless:
    - workload.sas.com/class=stateless:NoSchedule

# Jump Server
jump_ip : ""

# NFS Server
nfs_ip  : ""

# The below configuration items are explicitly set to their defaults.
# It is uncommon to need to amend these in most deployments.
