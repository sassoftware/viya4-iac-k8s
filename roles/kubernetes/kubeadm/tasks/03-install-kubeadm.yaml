---
# Install kubeadm, kubectl, and kubelet

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_os_family == "Debian"
  tags:
    - kubeadm-install
    - gpg-key

- name: Download Kubernetes GPG key (Debian)
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version.split('.')[0] }}.{{ kubernetes_version.split('.')[1] }}/deb/Release.key"
    dest: /tmp/kubernetes-apt-keyring.asc
    mode: '0644'
  when: ansible_os_family == "Debian"
  tags:
    - kubeadm-install
    - gpg-key

- name: Add Kubernetes GPG key to keyring (Debian)
  ansible.builtin.shell: |
    gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg < /tmp/kubernetes-apt-keyring.asc
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  when: ansible_os_family == "Debian"
  tags:
    - kubeadm-install
    - gpg-key

- name: Add Kubernetes repository (Debian)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version.split('.')[0] }}.{{ kubernetes_version.split('.')[1] }}/deb/ /"
    state: present
  when: ansible_os_family == "Debian"
  tags:
    - kubeadm-install
    - repo

# RedHat support disabled - Ubuntu-only deployment
# - name: Add Kubernetes repository (RedHat)
#   community.general.yum_repository:
#     name: kubernetes
#     baseurl: https://packages.cloud.google.com/yum/repos/kubernetes-el7-x86_64
#     enabled: true
#     gpgcheck: true
