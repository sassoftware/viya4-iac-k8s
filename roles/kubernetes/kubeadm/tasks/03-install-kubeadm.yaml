- name: Enable kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    masked: false
    daemon_reload: true
  tags:
    - kubeadm-install
    - kubelet

- name: Display kubeadm installation summary
  debug:
    msg:
      - "Kubeadm tools installed successfully:"
      - "  Kubernetes version: {{ kubernetes_full_version | default(kubernetes_version) }}"
      - "  Packages held at current version to prevent auto-upgrades"
  tags:
    - kubeadm-install
    - debug
