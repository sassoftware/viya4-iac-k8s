---
# Default variables for kubeadm role

# kubernetes_version is intentionally NOT defaulted here.
# It must be supplied via the Ansible vars file generated by Terraform
# (cluster_version in tfvars -> kubernetes_version in ansible-vars.yaml).
# Omitting the default ensures a clear early failure if the vars file
# is missing, rather than silently deploying the wrong version.

# Container runtime selection: docker, containerd, crio
kubernetes_cri: "containerd"

# CNI plugin selection
kubernetes_cni: "calico"

# Kubernetes cluster settings
kubeadm_advertise_address: "{{ ansible_default_ipv4.address }}"
kubeadm_pod_network_cidr: "10.42.0.0/16"
kubeadm_service_cidr: "10.43.0.0/16"
kubeadm_dns_domain: "cluster.local"

# API server
kubeadm_api_server_port: 6443
kubeadm_api_server_bind_port: 6443

# Kubelet settings
kubeadm_kubelet_extra_args: ""
kubeadm_kubelet_cgroupDriver: "systemd"

# Azure cloud provider settings
azure_location: "{{ azure_location | default('eastus') }}"
azure_resource_group: "{{ azure_resource_group | default('my-resource-group') }}"
azure_client_id: "{{ azure_client_id | default('') }}"
azure_client_secret: "{{ azure_client_secret | default('') }}"
azure_tenant_id: "{{ azure_tenant_id | default('') }}"
azure_subscription_id: "{{ azure_subscription_id | default('') }}"
# azure_ccm_version is supplied via ansible-vars.yaml (generated by Terraform from
# the `azure_ccm_version` tfvar). Do NOT tie this to kubernetes_version — the Azure
# CCM image at mcr.microsoft.com/oss/kubernetes/azure-cloud-controller-manager is
# released on its own schedule and does not track K8s minor versions one-to-one.
# A conservative fallback is defined here in case the vars file is missing the key.
azure_ccm_version: "{{ azure_ccm_version | default('1.35.0') }}"
azure_lb_type: "Standard"

# Cluster prefix
prefix: "{{ prefix | default('k8s') }}"

# Standard kubeadm admin kubeconfig — used by all Helm/kubectl tasks running on the control plane
kubeadm_admin_kubeconfig: /etc/kubernetes/admin.conf

# Container runtime configurations
docker_storage_driver: "overlay2"
docker_log_driver: "json-file"
docker_log_max_size: "10m"
docker_log_max_file: "3"

containerd_storage_driver: "overlay2"
containerd_cgroup_driver: "systemd"

crio_storage_driver: "overlay2"
crio_cgroup_driver: "systemd"
crio_os: "xUbuntu_22.04"
crio_version: "1.28"

# System packages for kubeadm
kubeadm_system_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - software-properties-common

# Feature gates (optional)
kubeadm_feature_gates: ""

# Audit settings
kubeadm_audit_log_enabled: false
kubeadm_audit_log_max_age: 30
kubeadm_audit_log_max_backup: 10
kubeadm_audit_log_max_size: 100

# API server timeouts
kubeadm_api_server_request_timeout: "3m"
kubeadm_api_server_shutdown_delay_duration: "15s"

# Cloud provider flag
enable_cloud_provider: true
deployment_type: "azure"
