---
# AWS cloud provider variables (placeholder for future implementation)

# AWS credentials
aws_access_key_id: "{{ aws_access_key_id | default('') }}"
aws_secret_access_key: "{{ aws_secret_access_key | default('') }}"
aws_region: "{{ aws_region | default('us-east-1') }}"

# AWS CCM versions
aws_ccm_version: "{{ kubernetes_version }}"

# AWS Load Balancer configuration
aws_lb_type: "nlb"  # network load balancer or classic
aws_nlb_backend_protocol: "tcp"
aws_nlb_health_check_protocol: "tcp"
aws_nlb_health_check_port: "10250"

# AWS network settings
aws_vpc_id: "{{ aws_vpc_id | default('') }}"
aws_subnet_ids: "{{ aws_subnet_ids | default([]) }}"
aws_security_group_id: "{{ aws_security_group_id | default('') }}"

# AWS IAM settings
aws_iam_role_name: "{{ prefix }}-ccm-role"
aws_iam_policy_name: "{{ prefix }}-ccm-policy"
